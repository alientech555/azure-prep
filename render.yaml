```yaml
# render.yaml - Render Infrastructure as Code Blueprint
# This file allows Render to automatically provision the static site.

services:
  - type: web
    name: cloudvibe-az900-prep
    env: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
```
